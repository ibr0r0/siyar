name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate contact directory
        run: pnpm validate:contacts

      # Malformed ICU renders as the key path at runtime and is invisible to
      # typecheck, tests and `next build`.
      - name: Check message catalogues
        run: pnpm --filter @siyar/web check:messages

      - name: Build
        run: pnpm build
